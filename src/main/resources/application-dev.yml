spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DEV_DB:fincore_dev}
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/dev-migration

fincore:
  security:
    jwt:
      issuer: fincore-dev
      audience: fincore-api-dev
  demo:
    seed:
      enabled: ${FINCORE_DEMO_SEED_ENABLED:false}
      alejandro-email: ${FINCORE_DEMO_ALEJANDRO_EMAIL:alejandro.demo@example.test}
      fernando-email: ${FINCORE_DEMO_FERNANDO_EMAIL:fernando.demo@example.test}
      alejandro-password: ${FINCORE_DEMO_ALEJANDRO_PASSWORD:}
      fernando-password: ${FINCORE_DEMO_FERNANDO_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
